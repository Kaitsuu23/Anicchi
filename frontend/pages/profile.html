<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — EcchiZone</title>
  <link rel="icon" type="image/x-icon" href="/icon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
  <link rel="manifest" href="/icon/site.webmanifest" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .profile-wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

    .profile-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 2rem;
      backdrop-filter: blur(24px); position: relative; overflow: hidden;
    }
    .profile-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }

    .profile-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, var(--sub), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; color: #fff; flex-shrink: 0;
      border: 2px solid var(--glass-border);
      box-shadow: 0 0 20px var(--glow);
    }
    .profile-avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
    .profile-name { font-size: 1.4rem; font-weight: 800; color: #fff; }
    .profile-email { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .profile-role {
      display: inline-block; margin-top: 6px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 2px 10px; border-radius: 999px;
      background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.3); color: var(--accent);
    }

    .stats-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .stat-box {
      flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 1rem; text-align: center;
    }
    .stat-num { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .section-title-sm { font-size: 0.82rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .form-label { font-size: 0.82rem; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
    .form-input {
      background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      border-radius: 10px; color: #fff; font-size: 0.95rem; font-family: 'Inter', sans-serif;
      padding: 0.65rem 1rem; outline: none; transition: all 0.3s ease;
    }
    .form-input:focus { border-color: var(--accent); background: rgba(0,0,0,0.4); box-shadow: 0 0 0 3px rgba(167,139,250,0.15); }
    .form-input::placeholder { color: var(--muted); }

    .save-btn {
      padding: 0.75rem 2rem; background: linear-gradient(135deg, var(--sub), var(--accent));
      border: none; border-radius: 10px; color: #fff; font-size: 0.95rem; font-weight: 700;
      font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(167,139,250,0.3);
    }
    .save-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(167,139,250,0.45); }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg { display:none; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.88rem; margin-bottom: 1rem; }
    .msg-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .msg-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }

    .divider { height: 1px; background: var(--glass-border); margin: 1.5rem 0; }

    .danger-btn {
      padding: 0.65rem 1.5rem; background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3); border-radius: 10px;
      color: #f87171; font-size: 0.9rem; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.3s ease;
    }
    .danger-btn:hover { background: rgba(239,68,68,0.2); border-color: #f87171; }

    .joined { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <nav data-subtitle="Profile"></nav>
  <main>
    <div class="profile-wrap">

      <!-- Profile Header Card -->
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar" id="avatar-display">?</div>
          <div>
            <div class="profile-name" id="display-username">—</div>
            <div class="profile-email" id="display-email">—</div>
            <div class="profile-role" id="display-role">user</div>
            <div class="joined" id="display-joined"></div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-num" id="stat-watched">—</div>
            <div class="stat-label">Watched</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" id="stat-favorites">—</div>
            <div class="stat-label">Favorites</div>
          </div>
        </div>

        <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
          <a href="/history" class="save-btn" style="text-decoration:none;font-size:0.85rem;padding:0.6rem 1.25rem">📺 Watch History</a>
        </div>
      </div>

      <!-- Edit Profile Card -->
      <div class="profile-card">
        <div class="section-title-sm">Edit Profil</div>
        <div id="edit-error" class="msg msg-error"></div>
        <div id="edit-success" class="msg msg-success"></div>

        <form id="edit-form">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input class="form-input" type="text" id="input-username" placeholder="username baru" minlength="3" maxlength="50" />
          </div>
          <div class="form-group">
            <label class="form-label">Avatar URL</label>
            <input class="form-input" type="url" id="input-avatar" placeholder="https://..." />
          </div>
          <button type="submit" class="save-btn" data-label="Simpan Perubahan">Simpan Perubahan</button>
        </form>

        <div class="divider"></div>

        <div class="section-title-sm">Ganti Password</div>
        <div id="pass-error" class="msg msg-error"></div>
        <div id="pass-success" class="msg msg-success"></div>

        <form id="pass-form">
          <div class="form-group">
            <label class="form-label">Password Lama</label>
            <input class="form-input" type="password" id="input-old-pass" placeholder="••••••••" />
          </div>
          <div class="form-group">
            <label class="form-label">Password Baru</label>
            <input class="form-input" type="password" id="input-new-pass" placeholder="••••••••" minlength="6" />
          </div>
          <div class="form-group">
            <label class="form-label">Konfirmasi Password Baru</label>
            <input class="form-input" type="password" id="input-confirm-pass" placeholder="••••••••" />
          </div>
          <button type="submit" class="save-btn" data-label="Ganti Password">Ganti Password</button>
        </form>

        <div class="divider"></div>
        <button class="danger-btn" onclick="if(confirm('Yakin logout?')) signOut()">🚪 Logout</button>
      </div>

    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/footer.js"></script>
  <script>
    (async () => {
      const token = localStorage.getItem('ez_token');
      if (!token) { location.href = '/login?redirect=/profile'; return; }

      // Load profile
      const res = await fetch('/api/auth?action=profile', { headers: { Authorization: `Bearer ${token}` } });
      const json = await res.json();
      if (!json.success) { location.href = '/login'; return; }

      const d = json.data;
      document.getElementById('display-username').textContent = d.username;
      document.getElementById('display-email').textContent = d.email;
      document.getElementById('display-role').textContent = d.role;
      document.getElementById('display-joined').textContent = 'Bergabung ' + new Date(d.created_at).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
      document.getElementById('stat-watched').textContent = d.stats.watched;
      document.getElementById('stat-favorites').textContent = d.stats.favorites;
      document.getElementById('input-username').value = d.username;
      if (d.avatar_url) document.getElementById('input-avatar').value = d.avatar_url;

      // Avatar display
      const avatarEl = document.getElementById('avatar-display');
      if (d.avatar_url) {
        avatarEl.innerHTML = `<img src="${d.avatar_url}" onerror="this.parentElement.textContent='${d.username[0].toUpperCase()}'" />`;
      } else {
        avatarEl.textContent = d.username[0].toUpperCase();
      }
    })();

    // Edit profile
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('.save-btn');
      const errEl = document.getElementById('edit-error');
      const okEl = document.getElementById('edit-success');
      [errEl, okEl].forEach(el => { el.style.display='none'; el.textContent=''; });

      btn.disabled = true; btn.textContent = 'Menyimpan...';
      const token = localStorage.getItem('ez_token');

      const res = await fetch('/api/auth?action=profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({
          username: document.getElementById('input-username').value.trim(),
          avatar_url: document.getElementById('input-avatar').value.trim() || null,
        }),
      });
      const json = await res.json();
      btn.disabled = false; btn.textContent = btn.dataset.label;

      if (!json.success) { errEl.textContent = json.message; errEl.style.display = 'block'; return; }
      okEl.textContent = json.message; okEl.style.display = 'block';
      document.getElementById('display-username').textContent = document.getElementById('input-username').value.trim();
    });

    // Change password
    document.getElementById('pass-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('.save-btn');
      const errEl = document.getElementById('pass-error');
      const okEl = document.getElementById('pass-success');
      [errEl, okEl].forEach(el => { el.style.display='none'; el.textContent=''; });

      const newPass = document.getElementById('input-new-pass').value;
      const confirm = document.getElementById('input-confirm-pass').value;
      if (newPass !== confirm) { errEl.textContent = 'Password baru tidak cocok.'; errEl.style.display='block'; return; }

      btn.disabled = true; btn.textContent = 'Menyimpan...';
      const token = localStorage.getItem('ez_token');

      const res = await fetch('/api/auth?action=profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({
          current_password: document.getElementById('input-old-pass').value,
          new_password: newPass,
        }),
      });
      const json = await res.json();
      btn.disabled = false; btn.textContent = btn.dataset.label;

      if (!json.success) { errEl.textContent = json.message; errEl.style.display='block'; return; }
      okEl.textContent = json.message; okEl.style.display='block';
      e.target.reset();
    });
  </script>
</body>
</html>
