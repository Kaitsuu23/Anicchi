<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — EcchiZone</title>
  <link rel="icon" type="image/x-icon" href="/icon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
  <link rel="manifest" href="/icon/site.webmanifest" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-page {
      min-height: calc(100vh - 80px);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      box-shadow: var(--shadow);
      position: relative; overflow: hidden;
    }
    .auth-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }
    .auth-title {
      font-size: 1.6rem; font-weight: 800; color: #fff;
      margin-bottom: 0.4rem; text-align: center;
    }
    .auth-subtitle {
      font-size: 0.9rem; color: var(--muted);
      text-align: center; margin-bottom: 2rem;
    }
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-label {
      font-size: 0.82rem; font-weight: 600;
      color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase;
    }
    .form-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 10px; color: #fff;
      font-size: 0.95rem; font-family: 'Inter', sans-serif;
      padding: 0.75rem 1rem; outline: none;
      transition: all 0.3s ease;
    }
    .form-input::placeholder { color: var(--muted); }
    .form-input:focus {
      border-color: var(--accent);
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.15);
    }
    .auth-btn {
      margin-top: 0.5rem;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--sub), var(--accent));
      border: none; border-radius: 10px;
      color: #fff; font-size: 1rem; font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(167,139,250,0.3);
    }
    .auth-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(167,139,250,0.45);
    }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-error {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px; padding: 0.75rem 1rem;
      font-size: 0.88rem; color: #f87171;
    }
    .auth-footer {
      text-align: center; margin-top: 1.5rem;
      font-size: 0.88rem; color: var(--muted);
    }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-divider {
      display: flex; align-items: center; gap: 0.75rem;
      margin: 0.5rem 0; color: var(--muted); font-size: 0.8rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--glass-border);
    }
  </style>
</head>
<body>
  <nav data-subtitle="Login"></nav>

  <main>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-title">⬡ EcchiZone</div>
        <div class="auth-subtitle">Masuk ke akun kamu</div>

        <div id="auth-error" class="auth-error"></div>

        <form class="auth-form" id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email"
              placeholder="kamu@email.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password"
              placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <button type="submit" class="auth-btn" data-label="Masuk">Masuk</button>
        </form>

        <div class="auth-footer">
          Belum punya akun? <a href="/register">Daftar sekarang</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getUser();
      if (user) location.href = '/';
      document.getElementById('login-form').addEventListener('submit', handleLogin);
    });
  </script>
</body>
</html>
