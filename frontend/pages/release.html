<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/icon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
  <link rel="manifest" href="/icon/site.webmanifest" />
  <title>Release – EcchiZone</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav><div><a href="/" class="nav-logo">⬡ EcchiZone</a><div class="nav-subtitle" id="nav-sub">Release</div></div></nav>
  <main>
    <div class="section-header" style="margin-bottom:1rem">
      <h2 class="section-title" id="page-title">Release</h2>
    </div>
    <div id="page-grid" class="series-grid"></div>
    <div id="pagination" class="pagination-bar"></div>
  </main>
  <script>
    const API = '/api';
    const year = location.pathname.replace(/^\/release\//, '').replace(/\/$/, '');
    let currentPage = 1;
    let lastPage = 1;

    document.title = `${year} – EcchiZone`;
    document.getElementById('page-title').textContent = year;
    document.getElementById('nav-sub').textContent = year;

    const grid = document.getElementById('page-grid');
    const paginationBar = document.getElementById('pagination');

    function skeletons() {
      return Array.from({ length: 18 }, () => `
        <div class="series-skeleton">
          <div class="skeleton" style="width:100%;aspect-ratio:2/3;border-radius:10px"></div>
        </div>`).join('');
    }

    function renderCard(v) {
      const badge = v.badge ? `<span class="badge badge-${v.badge.toLowerCase().trim()}">${v.badge.trim()}</span>` : '';
      const rating = v.rating ? `<span class="card-rating"><span class="star">★</span>${v.rating}</span>` : '';
      return `
        <a class="series-card" href="/detail?url=${encodeURIComponent(v.link)}" title="${v.title}">
          <div class="series-poster">
            <img src="${v.thumbnail || ''}" alt="${v.title}" loading="lazy"
              onerror="this.src='https://placehold.co/200x280/0a0a0f/444?text=No+Image'" />
            ${badge}${rating}
            <div class="series-overlay">${v.title}</div>
          </div>
        </a>`;
    }

    function renderPagination(cur, last) {
      if (last <= 1) { paginationBar.innerHTML = ''; return; }
      const btns = [];
      if (cur > 1) btns.push(`<button class="page-btn page-nav" onclick="loadPage(${cur - 1})">‹</button>`);
      for (let i = Math.max(1, cur - 1); i <= Math.min(last, cur + 1); i++) {
        btns.push(`<button class="page-btn ${i === cur ? 'active' : ''}" onclick="loadPage(${i})">${i}</button>`);
      }
      if (cur < last) btns.push(`<button class="page-btn page-nav" onclick="loadPage(${cur + 1})">›</button>`);
      paginationBar.innerHTML = btns.join('');
    }

    async function loadPage(page = 1) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      grid.innerHTML = skeletons();
      paginationBar.innerHTML = '';
      try {
        const res = await fetch(`${API}/release/${year}?page=${page}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        const { videos, currentPage: cp, lastPage: lp } = json.data;
        currentPage = cp; lastPage = lp;
        grid.innerHTML = videos.length ? videos.map(renderCard).join('') : `<div class="error-msg"><span>🎬</span>Tidak ada data.</div>`;
        renderPagination(cp, lp);
      } catch (err) {
        grid.innerHTML = `<div class="error-msg"><span>⚠️</span>${err.message}</div>`;
      }
    }

    loadPage(1);
  </script>
  <script src="/js/navbar.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>
