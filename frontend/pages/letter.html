<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/icon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
  <link rel="manifest" href="/icon/site.webmanifest" />
  <title>EcchiZone</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav><div><a href="/" class="nav-logo">⬡ EcchiZone</a><div class="nav-subtitle" id="nav-sub">Series</div></div></nav>
  <main>
    <div class="abc-bar" id="abc-bar">
      <a class="abc-btn" href="/letter/title-09/">#</a>
      <a class="abc-btn" href="/letter/title-a/">A</a>
      <a class="abc-btn" href="/letter/title-b/">B</a>
      <a class="abc-btn" href="/letter/title-c/">C</a>
      <a class="abc-btn" href="/letter/title-d/">D</a>
      <a class="abc-btn" href="/letter/title-e/">E</a>
      <a class="abc-btn" href="/letter/title-f/">F</a>
      <a class="abc-btn" href="/letter/title-g/">G</a>
      <a class="abc-btn" href="/letter/title-h/">H</a>
      <a class="abc-btn" href="/letter/title-i/">I</a>
      <a class="abc-btn" href="/letter/title-j/">J</a>
      <a class="abc-btn" href="/letter/title-k/">K</a>
      <a class="abc-btn" href="/letter/title-l/">L</a>
      <a class="abc-btn" href="/letter/title-m/">M</a>
      <a class="abc-btn" href="/letter/title-n/">N</a>
      <a class="abc-btn" href="/letter/title-o/">O</a>
      <a class="abc-btn" href="/letter/title-p/">P</a>
      <a class="abc-btn" href="/letter/title-q/">Q</a>
      <a class="abc-btn" href="/letter/title-r/">R</a>
      <a class="abc-btn" href="/letter/title-s/">S</a>
      <a class="abc-btn" href="/letter/title-t/">T</a>
      <a class="abc-btn" href="/letter/title-u/">U</a>
      <a class="abc-btn" href="/letter/title-v/">V</a>
      <a class="abc-btn" href="/letter/title-w/">W</a>
      <a class="abc-btn" href="/letter/title-x/">X</a>
      <a class="abc-btn" href="/letter/title-y/">Y</a>
      <a class="abc-btn" href="/letter/title-z/">Z</a>
    </div>
    <div class="sort-bar">
      <button class="sort-btn" id="btn-rating">By Rating</button>
      <button class="sort-btn active" id="btn-az">A-Z</button>
      <span class="sort-label">Views:</span>
      <button class="sort-btn" id="btn-weekly">week</button>
      <button class="sort-btn" id="btn-monthly">month</button>
      <button class="sort-btn" id="btn-alltime">all time</button>
    </div>
    <div id="page-grid" class="series-grid"></div>
    <div id="pagination" class="pagination-bar"></div>
  </main>
  <script>
    // Ambil slug dari path: /letter/title-d/ → "title-d"
    const letterParam = location.pathname.replace(/^\/letter\//, '').replace(/\/$/, '') || '';
    const filterParam = new URLSearchParams(location.search).get('filter') || '';
    const label = letterParam.replace('title-', '').toUpperCase();
    document.title = `${label} – EcchiZone`;
    document.getElementById('nav-sub').textContent = `Series: ${label}`;

    // Highlight active letter
    document.querySelectorAll('.abc-btn').forEach(btn => {
      const btnSlug = btn.pathname.replace(/^\/letter\//, '').replace(/\/$/, '');
      if (btnSlug === letterParam) btn.classList.add('active');
    });

    const BASE_URL_LETTER = `https://hentaimama.io/?letter=true&s=${letterParam}`;
    const CURRENT_URL = filterParam ? `${BASE_URL_LETTER}&filter=${filterParam}` : BASE_URL_LETTER;

    // Highlight active sort btn
    const filterBtnMap = { 'rating': 'btn-rating', 'weekly': 'btn-weekly', 'monthly': 'btn-monthly', 'alltime': 'btn-alltime', '': 'btn-az' };
    document.getElementById(filterBtnMap[filterParam] || 'btn-az')?.classList.add('active');

    // Sort buttons
    const sortMap = {
      'btn-rating':  [BASE_URL_LETTER + '&filter=rating',  `/letter/${letterParam}/?filter=rating`],
      'btn-az':      [BASE_URL_LETTER,                      `/letter/${letterParam}/`],
      'btn-weekly':  [BASE_URL_LETTER + '&filter=weekly',  `/letter/${letterParam}/?filter=weekly`],
      'btn-monthly': [BASE_URL_LETTER + '&filter=monthly', `/letter/${letterParam}/?filter=monthly`],
      'btn-alltime': [BASE_URL_LETTER + '&filter=alltime', `/letter/${letterParam}/?filter=alltime`],
    };
    Object.entries(sortMap).forEach(([id, [apiUrl, pageUrl]]) => {
      document.getElementById(id)?.addEventListener('click', function() {
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        window.history.pushState({}, '', pageUrl);
        loadPage(apiUrl);
      });
    });

    const BASE_URL = CURRENT_URL;
  </script>
  <script src="/js/pagelist.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>
