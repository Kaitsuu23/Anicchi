<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch History — EcchiZone</title>
  <link rel="icon" type="image/x-icon" href="/icon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
  <link rel="manifest" href="/icon/site.webmanifest" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav data-subtitle="Watch History"></nav>
  <main>
    <div class="section-header" style="margin-bottom:1.5rem">
      <h2 class="section-title">Watch History</h2>
      <button class="see-all-btn" id="clear-btn" style="color:#f87171;border-color:rgba(239,68,68,0.3)">🗑 Clear All</button>
    </div>
    <div id="history-grid" class="list-grid"></div>
    <div id="history-empty" style="display:none" class="error-msg">
      <span>📭</span>Belum ada riwayat tontonan.
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/footer.js"></script>
  <script>
    (async () => {
      const token = localStorage.getItem('ez_token');
      if (!token) { location.href = '/login?redirect=/history'; return; }

      const grid = document.getElementById('history-grid');
      const empty = document.getElementById('history-empty');

      // Skeleton
      grid.innerHTML = Array.from({ length: 10 }, () => `
        <div class="skeleton-card">
          <div class="skeleton skeleton-thumb"></div>
          <div class="skeleton skeleton-line" style="margin:.6rem 0 .3rem"></div>
          <div class="skeleton skeleton-line short"></div>
        </div>`).join('');

      try {
        const res = await fetch('/api/auth?action=history&limit=50', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const json = await res.json();
        if (!json.success) throw new Error();

        if (!json.data.length) {
          grid.innerHTML = '';
          empty.style.display = 'block';
          return;
        }

        grid.innerHTML = json.data.map(item => {
          const cover = item.video_cover_url || 'https://placehold.co/200x280/0a0a0f/444?text=N/A';
          const progress = item.watch_progress || 0;
          const pct = Math.min(100, Math.round((progress / 1500) * 100));
          const timeStr = progress > 0 ? `${Math.floor(progress/60)}m ${progress%60}s` : '';
          const date = new Date(item.last_watched).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
          return `
            <div class="card" style="position:relative">
              <a href="/episodes/${item.video_slug}/" class="card" style="text-decoration:none;color:inherit">
                <div class="card-poster">
                  <img class="card-thumb" src="${cover}" alt="${item.video_title || ''}" loading="lazy"
                    onerror="this.src='https://placehold.co/200x280/0a0a0f/444?text=N/A'" />
                  <div class="card-series-overlay">${item.series_title || item.video_title || ''}</div>
                  <div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,0.1)">
                    <div style="height:100%;background:var(--accent);width:${pct}%;border-radius:2px"></div>
                  </div>
                </div>
                <div class="card-body">
                  <div class="card-title">${item.video_title || ''}</div>
                  <div class="card-date">${timeStr ? `⏱ ${timeStr} · ` : ''}${date}</div>
                </div>
              </a>
              <button onclick="deleteItem('${item.video_slug}', this)" title="Hapus"
                style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#f87171;cursor:pointer;padding:4px 8px;font-size:0.75rem;z-index:5">✕</button>
            </div>`;
        }).join('');

      } catch {
        grid.innerHTML = '';
        empty.style.display = 'block';
      }

      // Clear all
      document.getElementById('clear-btn').addEventListener('click', async () => {
        if (!confirm('Hapus semua riwayat?')) return;
        const items = document.querySelectorAll('#history-grid .card[style*="position"]');
        for (const item of items) {
          const slug = item.querySelector('button')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
          if (slug) await deleteFromDB(slug);
        }
        grid.innerHTML = '';
        empty.style.display = 'block';
      });
    })();

    async function deleteItem(slug, btn) {
      await deleteFromDB(slug);
      btn.closest('.card').remove();
      if (!document.querySelector('#history-grid .card')) {
        document.getElementById('history-empty').style.display = 'block';
      }
    }

    async function deleteFromDB(slug) {
      const token = localStorage.getItem('ez_token');
      await fetch('/api/auth?action=history', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ video_slug: slug }),
      });
    }
  </script>
</body>
</html>
