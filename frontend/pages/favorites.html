<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorites — EcchiZone</title>
  <link rel="icon" type="image/x-icon" href="/icon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
  <link rel="manifest" href="/icon/site.webmanifest" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav data-subtitle="Favorites"></nav>
  <main>
    <div class="section-header" style="margin-bottom:1.5rem">
      <h2 class="section-title">Favorites</h2>
    </div>
    <div id="fav-grid" class="list-grid"></div>
    <div id="fav-empty" style="display:none" class="error-msg">
      <span>🤍</span>Belum ada favorit. Tambahkan dari halaman detail atau episode.
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/footer.js"></script>
  <script>
    (async () => {
      const token = localStorage.getItem('ez_token');
      if (!token) { location.href = '/login?redirect=/favorites/'; return; }

      const grid = document.getElementById('fav-grid');
      const empty = document.getElementById('fav-empty');

      grid.innerHTML = Array.from({ length: 10 }, () => `
        <div class="skeleton-card">
          <div class="skeleton skeleton-thumb"></div>
          <div class="skeleton skeleton-line" style="margin:.6rem 0 .3rem"></div>
          <div class="skeleton skeleton-line short"></div>
        </div>`).join('');

      const res = await fetch('/api/auth?action=favorites', { headers: { Authorization: `Bearer ${token}` } });
      const json = await res.json();

      if (!json.success || !json.data.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      grid.innerHTML = json.data.map(item => {
        const cover = item.video_cover_url || 'https://placehold.co/200x280/0a0a0f/444?text=N/A';
        const href = item.video_type === 'episode' ? `/episodes/${item.video_slug}/` : `/detail/${item.video_slug}/`;
        const date = new Date(item.created_at).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
        return `
          <div style="position:relative">
            <a class="card" href="${href}" title="${item.video_title || ''}">
              <div class="card-poster">
                <img class="card-thumb" src="${cover}" alt="${item.video_title || ''}" loading="lazy"
                  onerror="this.src='https://placehold.co/200x280/0a0a0f/444?text=No+Image'" />
                <div class="card-series-overlay">${item.video_title || ''}</div>
                <button onclick="event.preventDefault(); event.stopPropagation(); removeFav('${item.video_slug}', this)" title="Hapus dari favorit"
                  style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#f87171;cursor:pointer;padding:4px 8px;font-size:0.75rem;z-index:5">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
              </div>
              <div class="card-body">
                <div class="card-title">${item.video_title || ''}</div>
                <div class="card-date">${date}</div>
              </div>
            </a>
          </div>`;
      }).join('');
    })();

    async function removeFav(slug, btn) {
      const token = localStorage.getItem('ez_token');
      await fetch('/api/auth?action=favorites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ video_slug: slug }),
      });
      btn.closest('div').remove();
      if (!document.querySelector('#fav-grid .card')) {
        document.getElementById('fav-empty').style.display = 'block';
      }
    }
  </script>
</body>
</html>
